<script>
'use strict';
const STORE='wedge-lab-data-v1';
const DEFAULT_CLUBS=['58°','54°','50°','46° PW','9 iron'];
const ORIGINAL_DEFAULT_CLUBS=['58°','54°','50°','46° PW','9 iron','8 iron','7 iron','6 iron','5 iron','Hybrid','Other'];
// Present a shorter practice bag if the old untouched starter list is still saved.
// No localStorage mutation: previous club lists and historical shots remain intact.
function practiceClubs(){const bag=Array.isArray(data.clubs)?data.clubs:DEFAULT_CLUBS;return bag.length===ORIGINAL_DEFAULT_CLUBS.length&&bag.every((c,i)=>c===ORIGINAL_DEFAULT_CLUBS[i])?[...DEFAULT_CLUBS]:bag.filter(c=>c!=='Unspecified');}
const NAV=[['home','⌂','Overview'],['start','◎','Practice'],['analytics','▥','Analysis'],['sessions','☷','Sessions'],['team','🏆','Team'],['settings','⚙','Settings']];
const APP_VERSION=1;
let data=loadData();
let ui={view:'home',preset:'30-75',min:30,max:75,shotIndex:0,mode:'offsets',filter:'all',club:'all',detailId:null,editIndex:null,message:null,teamPlay:false,clubPickerOpen:false};
let formCache={};
function loadData(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x && x.version===1 && Array.isArray(x.sessions))return {...x,clubs:Array.isArray(x.clubs)&&x.clubs.length?x.clubs:DEFAULT_CLUBS};}catch(e){}return {version:APP_VERSION,clubs:[...DEFAULT_CLUBS],sessions:[],draft:null};}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(data));if(typeof WedgeCloud!=='undefined')WedgeCloud.schedule();return true;}catch(e){alert('Your browser could not store the session. Export a JSON backup in Settings before closing this page.');return false;}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(v,d=1){return Number.isFinite(Number(v))?Number(v).toFixed(d):'—';}
function round(v,d=1){return Math.round((v+Number.EPSILON)*10**d)/10**d;}
function formatDate(v){if(!v)return 'Date unknown';const d=new Date(v);return Number.isNaN(+d)?'Date unknown':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function randId(){return 'wl-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);}
function namePreset(p,min,max){return p==='30-75'?'30–75 yd':p==='50-90'?'50–90 yd':p==='90-135'?'90–135 yd':p==='120-155'?'120–155 yd':`${min}–${max} yd`}
function offsets(s){return {x:(+s.right||0)-(+s.left||0),y:(+s.long||0)-(+s.short||0)};}
function radial(s){const {x,y}=offsets(s);return Math.hypot(x,y)}
function sum(a){return a.reduce((x,y)=>x+y,0)}
function mean(a){return a.length?sum(a)/a.length:0}
function median(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);let m=(s.length-1)/2;return (s[Math.floor(m)]+s[Math.ceil(m)])/2}
function stats(shots){let n=shots.length;if(!n)return {n:0,avg:0,median:0,meanX:0,meanY:0,avgX:0,avgY:0,within5:0,within10:0,p80:0,shortPct:0,longPct:0,leftPct:0,rightPct:0};const rs=shots.map(radial),xy=shots.map(offsets);return {n,avg:mean(rs),median:median(rs),meanX:mean(xy.map(i=>i.x)),meanY:mean(xy.map(i=>i.y)),avgX:mean(xy.map(i=>Math.abs(i.x))),avgY:mean(xy.map(i=>Math.abs(i.y))),within5:100*rs.filter(r=>r<=5).length/n,within10:100*rs.filter(r=>r<=10).length/n,p80:[...rs].sort((a,b)=>a-b)[Math.ceil(.8*n)-1],shortPct:100*xy.filter(i=>i.y<0).length/n,longPct:100*xy.filter(i=>i.y>0).length/n,leftPct:100*xy.filter(i=>i.x<0).length/n,rightPct:100*xy.filter(i=>i.x>0).length/n}}
function combineScore(shots){if(shots.length!==20)return null;return sum(shots.map(radial).sort((a,b)=>a-b).slice(0,17))}

function genTargets(min,max){
 const n=20,span=max-min+1;
 // Normal combine ranges: 20 distinct yardages, four from each of five
 // distance bands, and at least 10 yd between consecutive shot targets.
 // Narrow custom ranges relax the gap; spans under 20 must repeat some yardages.
 const gap=span>=30?10:span>=20?Math.max(1,Math.floor(span/4)):span>1?1:0;
 const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
 let pool=[];
 for(let attempt=0;attempt<10;attempt++){
  pool=[];
  if(span>=n){
   for(let band=0;band<5;band++){
    const lo=min+Math.floor(band*span/5),hi=min+Math.floor((band+1)*span/5)-1;
    pool.push(...shuffle(Array.from({length:hi-lo+1},(_,i)=>lo+i)).slice(0,4));
   }
  }else pool=shuffle(Array.from({length:n},(_,i)=>min+(i%span)));
  const path=[],used=new Array(n).fill(false);let visited=0;
  function visit(last){
   if(path.length===n)return true;
   if(++visited>2500)return false;
   const candidates=[];
   for(let i=0;i<n;i++)if(!used[i]&&(last<0||Math.abs(pool[i]-pool[last])>=gap))candidates.push(i);
   shuffle(candidates);
   // Use constrained targets first so late shots don't get stuck nearby.
   const degree=new Array(n).fill(0);
   for(const i of candidates)for(let j=0;j<n;j++)if(!used[j]&&j!==i&&Math.abs(pool[j]-pool[i])>=gap)degree[i]++;
   candidates.sort((a,b)=>degree[a]-degree[b]);
   for(const i of candidates){path.push(i);used[i]=true;if(visit(i))return true;path.pop();used[i]=false;}
   return false;
  }
  if(visit(-1))return path.map(i=>pool[i]);
 }
 // Only a last-resort fallback for impractically narrow custom ranges.
 // Never discard a sampled target and never change saved sessions.
 let best=shuffle(pool.slice()),bestGap=-1;
 for(let i=0;i<120;i++){
  const order=shuffle(pool.slice());
  const smallest=Math.min(...order.slice(1).map((v,j)=>Math.abs(v-order[j])));
  if(smallest>bestGap){best=order;bestGap=smallest;}
 }
 return best;
}

function insightHTML(rows){let s=stats(rows),n=s.n;if(n<10)return '<div class="notice">Keep collecting shots before drawing conclusions.</div>';let statement=s.meanY<=-1?`<b>Short tendency:</b> Your landing pattern averages ${fmt(Math.abs(s.meanY))} yards short.`:s.meanY>=1?`<b>Long tendency:</b> Your landing pattern averages ${fmt(s.meanY)} yards long.`:`<b>Good depth centering:</b> Average long/short bias is only ${fmt(Math.abs(s.meanY))} yards.`;let h=s.meanX<=-1?`Your lateral center is ${fmt(Math.abs(s.meanX))} yards left.`:s.meanX>=1?`Your lateral center is ${fmt(s.meanX)} yards right.`:`Your lateral center is near the target line (${fmt(Math.abs(s.meanX))} yd).`;return `<div class="notice">${statement}<br><br>${h}</div><div class="listrow"><div><b>Within 5 yards</b><div class="meta">About 15 feet of the target</div></div><strong>${fmt(s.within5,0)}%</strong></div><div class="listrow"><div><b>80% of shots inside</b><div class="meta">A useful dispersion indicator</div></div><strong>${fmt(s.p80)} yd</strong></div><div class="listrow"><div><b>Short / long</b><div class="meta">Percent of all shots (exact-depth shots excluded from both)</div></div><strong>${fmt(s.shortPct,0)}% / ${fmt(s.longPct,0)}%</strong></div>`}
function scatterPlot(shots){if(!shots.length)return '<div class="empty">No shots to plot.</div>';const W=420,H=365,cx=W/2,cy=H/2+7,margin=35;let extent=Math.max(10,Math.ceil(Math.max(...shots.map(r=>Math.max(Math.abs(offsets(r).x),Math.abs(offsets(r).y))))/5)*5);const scale=Math.min((W/2-margin)/extent,(H/2-margin)/extent);let circles=shots.map((s,i)=>{let o=offsets(s),x=cx+o.x*scale,y=cy-o.y*scale;return `<circle cx="${x}" cy="${y}" r="5" fill="#3189B6" fill-opacity=".76" stroke="#FFFFFF" stroke-width="1.1"><title>Shot ${i+1}: ${s.target} yd, ${esc(s.club)}, ${fmt(radial(s))} yd off</title></circle>`}).join('');return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Shot dispersion chart: right is right of target, up is long, center is the target"><rect x="8" y="8" width="404" height="349" rx="16" fill="#F6FBFF"/>${[5,10,15,20,30,40,50,75].filter(z=>z<=extent).map(z=>`<circle cx="${cx}" cy="${cy}" r="${z*scale}" fill="none" stroke="#D9E9F3" stroke-dasharray="4 5" stroke-width="1"/>`).join('')}<line x1="25" y1="${cy}" x2="395" y2="${cy}" stroke="#A6CADE"/><line x1="${cx}" y1="25" x2="${cx}" y2="342" stroke="#A6CADE"/><text x="${cx}" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#53758A">LONG</text><text x="${cx}" y="354" text-anchor="middle" font-size="11" font-weight="700" fill="#53758A">SHORT</text><text x="15" y="${cy-9}" font-size="10" fill="#53758A">LEFT</text><text x="393" y="${cy-9}" font-size="10" text-anchor="end" fill="#53758A">RIGHT</text>${circles}<circle cx="${cx}" cy="${cy}" r="7" fill="#F5C454" stroke="#163F60" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="2" fill="#163F60"/><text x="${cx+11}" y="${cy+14}" font-size="9" fill="#365E79">TARGET</text><text x="395" y="344" text-anchor="end" font-size="10" fill="#5B7C91">±${extent} yd scale</text></svg>`}
function renderAnalytics(){const rows=filteredRows(),s=stats(rows),sessions=filteredSessions();let grouped=new Map();for(let r of rows){let k=Math.floor(r.target/10)*10;if(!grouped.has(k))grouped.set(k,[]);grouped.get(k).push(r)}let clubg=new Map();for(let r of rows){let k=r.club||'Unspecified';if(!clubg.has(k))clubg.set(k,[]);clubg.get(k).push(r)}const sortedBins=[...grouped.entries()].sort((a,b)=>a[0]-b[0]);let trend=sessions.filter(ss=>ss.shots.length===20).sort((a,b)=>(a.completedAt||'').localeCompare(b.completedAt||''));return `<div class="eyebrow">PERFORMANCE LAB</div><h1>Find the patterns.</h1><p class="sub">Use all your shots to spot predictable misses, then turn those weaknesses into next week's practice plan.</p>
<div class="filters"><div class="field"><label>Target range</label><select id="analysis-filter"><option value="all" ${ui.filter==='all'?'selected':''}>All ranges</option><option value="30-75" ${ui.filter==='30-75'?'selected':''}>30–75 yd</option><option value="50-90" ${ui.filter==='50-90'?'selected':''}>50–90 yd</option><option value="90-135" ${ui.filter==='90-135'?'selected':''}>90–135 yd</option><option value="120-155" ${ui.filter==='120-155'?'selected':''}>120–155 yd</option><option value="custom" ${ui.filter==='custom'?'selected':''}>Custom</option></select></div><div class="field"><label>Club</label><select id="club-filter"><option value="all">All clubs</option>${[...new Set(data.sessions.flatMap(x=>x.shots.map(s=>s.club)))].sort().map(k=>`<option value="${esc(k)}" ${ui.club===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div><button class="btn ghost tinybtn" data-action="clear-filters">Clear filters</button></div>
${!rows.length?`<div class="empty"><div class="emoj">📈</div><strong>No shots in this selection yet.</strong>Complete a combine to unlock your charts and club-by-club insights.</div>`:`<div class="cards">${statCard('Shots analyzed',s.n,'Across '+sessions.length+' sessions')}${statCard('Average radial miss',fmt(s.avg)+' yd','All shots included')}${statCard('Carry bias',direction(s.meanY,'short','long'),fmt(s.avgY)+' yd absolute error')}${statCard('Lateral bias',direction(s.meanX,'left','right'),fmt(s.avgX)+' yd absolute error')}</div>
<div class="twocharts"><div class="panel"><h2>Shot dispersion</h2>${scatterPlot(rows)}<div class="landing-key"><span class="dot"></span> Each dot = one shot <span style="margin-left:15px">● Target center</span></div></div><div class="panel"><h2>Accuracy over time</h2>${trendChart(trend,ui.club)}<div class="footnote">Plots untrimmed mean target miss by combine. Only compare similar target ranges, conditions, and clubs.</div><div class="divider"></div>${insightHTML(rows)}</div></div>
<div class="columns"><div class="panel"><div class="panelhead"><h2>Accuracy by yardage</h2><span class="tag">10-yard buckets</span></div><div class="tablewrap"><table class="tinytable"><thead><tr><th>Target</th><th class="r">Shots</th><th class="r">Avg miss</th><th class="r">Carry bias</th><th class="r">L/R bias</th></tr></thead><tbody>${sortedBins.map(([k,v])=>{let q=stats(v);return `<tr><td><b>${k}–${k+9}</b> yd</td><td class="r">${q.n} ${q.n<8?'<span class="rowbadge low">Small n</span>':''}</td><td class="r"><b>${fmt(q.avg)}</b> yd</td><td class="r">${direction(q.meanY,'short','long')}</td><td class="r">${direction(q.meanX,'left','right')}</td></tr>`}).join('')}</tbody></table></div><div class="footnote">A range needs roughly 8–10+ shots before its average is worth comparing. More is better.</div></div>
<div class="panel"><div class="panelhead"><h2>Accuracy by club</h2><span class="tag">Includes partial swings</span></div><div class="tablewrap"><table class="tinytable"><thead><tr><th>Club</th><th class="r">Shots</th><th class="r">Avg miss</th><th class="r">Short rate</th></tr></thead><tbody>${[...clubg.entries()].sort((a,b)=>stats(a[1]).avg-stats(b[1]).avg).map(([k,v])=>{let q=stats(v);return `<tr><td><b>${esc(k)}</b></td><td class="r">${q.n}</td><td class="r"><b>${fmt(q.avg)}</b> yd</td><td class="r">${fmt(q.shortPct,0)}%</td></tr>`}).join('')}</tbody></table></div><div class="footnote">Club comparison is affected by target distance. Compare the same yardage bucket and similar conditions for fair conclusions.</div></div></div>`}`}
function trendChart(ss,club){let pts=ss.map(s=>{let shots=club==='all'?s.shots:s.shots.filter(z=>z.club===club);return {v:shots.length?stats(shots).avg:null,n:shots.length,dt:s.completedAt||s.createdAt}}).filter(p=>p.v!==null).slice(-15);if(pts.length<2)return '<div class="empty" style="min-height:210px"><strong>Trends unlock after two combines.</strong>More sessions = better evidence of improvement.</div>';const W=500,H=235,pad=37,v=pts.map(p=>p.v),lo=Math.max(0,Math.floor(Math.min(...v)-1)),hi=Math.ceil(Math.max(...v)+1);const x=i=>pad+i*(W-2*pad)/(pts.length-1),y=z=>H-pad-(z-lo)/(hi-lo||1)*(H-2*pad);return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of average miss by session"><rect width="${W}" height="${H}" rx="12" fill="#F8FCFF"/>${[0,.25,.5,.75,1].map(q=>{let yy=pad+(H-2*pad)*q;return `<line x1="${pad}" x2="${W-pad}" y1="${yy}" y2="${yy}" stroke="#D5E7F1"/><text x="5" y="${yy+3}" fill="#647E91" font-size="10">${fmt(hi-(hi-lo)*q)}</text>`}).join('')}<polyline points="${pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(' ')}" fill="none" stroke="#2E749C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="#F5C454" stroke="#2E749C" stroke-width="2"><title>${formatDate(p.dt)}: ${fmt(p.v)} yd avg (${p.n} shots)</title></circle>`).join('')}<text x="${W/2}" y="${H-6}" text-anchor="middle" fill="#5B7C91" font-size="11">Combines, oldest → newest · Lower is better</text></svg>`}
function renderSessions(){let sessions=[...data.sessions].sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));return `<div class="eyebrow">YOUR PRACTICE ARCHIVE</div><div class="panelhead"><div><h1>Every combine. Saved.</h1><p class="sub" style="margin-bottom:0">Open any session, inspect your 20 landing points, or correct a logged shot.</p></div><button class="btn dark" data-go="start">+ New combine</button></div>
${data.draft?`<div class="notice warn" style="margin-bottom:15px">Unfinished combine: ${esc(namePreset(data.draft.preset,data.draft.min,data.draft.max))}, ${data.draft.shots.length}/20 recorded. <button class="btn ghost tinybtn" data-action="resume">Resume</button></div>`:''}
<section class="panel">${sessions.length?sessions.map(s=>`<div class="listrow"><div><div class="name">${esc(namePreset(s.preset,s.min,s.max))} <span class="tag">${s.shots.length} shots</span></div><div class="meta">${formatDate(s.completedAt)} · ${fmt(stats(s.shots).avg)} yd mean miss · ${esc(s.wind||'Wind unknown')} · ${esc(s.surface||'Surface unknown')}</div></div><div class="inline"><div class="bigscore">${fmt(combineScore(s.shots))}</div><button class="btn ghost tinybtn" data-detail="${esc(s.id)}">Report →</button></div></div>`).join(''):'<div class="empty"><div class="emoj">🗂️</div><strong>No completed combines yet.</strong>Start a 20-shot session to build your practice history.</div>'}</section>`}
function renderEdit(){let d=findSession(ui.detailId);if(!d)return renderSessions();let sh=d.shots[ui.editIndex];if(!sh)return renderDetail();return `<div class="eyebrow">CORRECT AN ENTRY</div><h1>Shot ${ui.editIndex+1} · ${sh.target} yd</h1><p class="sub">Edit the recorded miss. Your combine score and analysis will update automatically.</p><div class="panel" style="max-width:610px"><div class="field"><label>Club used</label><select id="editclub">${['Unspecified',...data.clubs].filter((x,i,a)=>a.indexOf(x)===i).map(c=>`<option ${sh.club===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="formgrid" style="margin:19px 0">${['left','right','long','short'].map(k=>`<div class="field"><label>${k[0].toUpperCase()+k.slice(1)} (yd)</label><input id="edit-${k}" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="${sh[k]}"></div>`).join('')}</div><div class="inline"><button class="btn dark" data-action="save-edit">Save correction</button><button class="btn ghost" data-action="cancel-edit">Cancel</button></div></div>`}

function renderBulkClubEdit(){
 const d=findSession(ui.detailId);if(!d)return renderSessions();
 const counts=new Map();for(const shot of d.shots){const club=shot.club||'Unspecified';counts.set(club,(counts.get(club)||0)+1);}
 const from=[...counts.keys()].sort((a,b)=>(counts.get(b)-counts.get(a))||a.localeCompare(b));
 const to=[...new Set([...practiceClubs(),...from])];
 return `<div class="eyebrow">CORRECT A COMPLETED COMBINE</div>
 <h1>Change session clubs</h1>
 <p class="sub">${esc(namePreset(d.preset,d.min,d.max))} · ${formatDate(d.completedAt)} · ${d.shots.length} shots</p>
 <div class="panel" style="max-width:620px">
 <p><b>Recorded the wrong club?</b> Replace it across this combine without re-entering any shots.</p>
 <div class="formgrid" style="margin:18px 0">
 <div class="field"><label for="bulk-from-club">Change shots logged as</label><select id="bulk-from-club">${from.map(c=>`<option value="${esc(c)}">${esc(c)} (${counts.get(c)} shots)</option>`).join('')}</select></div>
 <div class="field"><label for="bulk-to-club">Correct club</label><select id="bulk-to-club"><option value="">Choose club…</option>${to.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>
 </div>
 <div class="notice">Only shots logged with the original club will change. <b>Scores, yardages, misses, dates, and other clubs stay exactly the same.</b></div>
 <div class="inline" style="margin-top:22px"><button class="btn dark" data-action="save-session-clubs">Save club correction</button><button class="btn ghost" data-action="cancel-session-clubs">Cancel</button></div>
 </div>`;
}
function saveSessionClubs(){
 const d=findSession(ui.detailId);if(!d)return go('sessions');
 const from=document.getElementById('bulk-from-club')?.value;
 const to=document.getElementById('bulk-to-club')?.value;
 const originalClubs=[...new Set(d.shots.map(sh=>sh.club||'Unspecified'))];
 const validTargets=new Set([...practiceClubs(),...originalClubs]);
 if(!originalClubs.includes(from)||!to||!validTargets.has(to)){alert('Choose an original club and a valid replacement club.');return}
 if(from===to){alert('Choose a different replacement club.');return}
 const affected=d.shots.filter(sh=>(sh.club||'Unspecified')===from).length;
 if(!affected){alert('No matching shots were found.');return}
 if(!confirm('Change '+affected+' shot'+(affected===1?'':'s')+' from '+from+' to '+to+' in this session? All other shot data and the combine score stay unchanged.'))return;
 const before=d.shots.map(sh=>sh.club);
 const previousScore=combineScore(d.shots);
 d.shots.forEach(sh=>{if((sh.club||'Unspecified')===from)sh.club=to});
 if(!persist()){d.shots.forEach((sh,i)=>{sh.club=before[i]});return}
 if(combineScore(d.shots)!==previousScore){d.shots.forEach((sh,i)=>{sh.club=before[i]});persist();alert('Club correction cancelled because the score unexpectedly changed.');return}
 go('detail');if(d.teamMemberId)WedgeTeam.onEdited(d.id);
}
function renderSettings(){return `<div class="eyebrow">YOUR SETUP & DATA</div><h1>Make it yours.</h1><p class="sub">The club list is editable. Personal practice stays local and works offline; invited LIU teammates can also opt into Team Mode.</p>${WedgeCloud.render()}<div class="columns"><div class="panel"><h2>My bag</h2><p class="hint">One club name per line. These are the large choices shown during practice. Saving this list changes future options only; previous shot records stay untouched.</p><div class="field"><label>Clubs available during practice</label><textarea id="clubs-setting" rows="11">${esc(practiceClubs().join('\n'))}</textarea></div><div style="margin-top:13px"><button class="btn dark" data-action="save-clubs">Save my bag</button></div></div><div class="panel"><h2>Your data is yours</h2><p class="hint">This first version stores everything in this browser's local storage. Different phones and computers do not sync automatically.</p><div class="inline" style="margin:18px 0"><button class="btn dark" data-action="export-json">↓ Full backup (.json)</button><button class="btn ghost" data-action="export-csv">↓ Shot data (.csv)</button><button class="btn ghost" data-action="import-json">↑ Import backup</button></div><div class="notice warn">Make a JSON backup regularly, especially before clearing browser data or switching devices. Private/incognito browsing may not preserve your records.</div><div class="divider"></div><h3>Your original DECADE screenshot</h3><p class="hint">I reconstructed all 20 shots from the 90–135 screenshot. Import them as an <b>undated</b> historical session; club names stay “Unspecified” because they were not shown.</p><button class="btn ghost" data-action="import-screenshot">Import screenshot combine (71.0)</button><p class="footnote">Your 50–90 screenshot shows 50.4, but without shot-level coordinates it cannot be used for dispersion or club analytics.</p></div></div>
<div class="panel"><h2>How to use Wedge Lab with FlightScope</h2><div class="columns" style="margin-bottom:0"><div><p class="hint"><b>1.</b> Align FlightScope to your intended target line (your reference tree works). Keep alignment consistent.</p><p class="hint"><b>2.</b> Play the random yardage. Record carry and offline, or the four DECADE-style miss directions.</p><p class="hint"><b>3.</b> Select the actual club used. A 54° from 95 yd and a 50° from 95 yd are different observations.</p></div><div><p class="hint"><b>4.</b> Use consistent balls and wind conditions when chasing one-yard improvements.</p><p class="hint"><b>5.</b> In Analysis, filter by the same range and compare clubs only at similar targets. A club hit mainly from 130 yd naturally has a tougher job than one hit from 60 yd.</p></div></div></div>`}

function showMessage(t){alert(t)}
function exportFile(filename,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function csv(s){return '"'+String(s??'').replaceAll('"','""')+'"'}
function exportCSV(){const cols=['session_id','date','range','ball','wind','surface','shot','target_yd','club','left_yd','right_yd','long_yd','short_yd','signed_x_right_yd','signed_y_long_yd','radial_miss_yd','trimmed_from_combine'];let lines=[cols.join(',')];for(let s of data.sessions){let ex=excludedIndices(s.shots);s.shots.forEach((sh,i)=>{let {x,y}=offsets(sh);let arr=[s.id,s.completedAt||'',namePreset(s.preset,s.min,s.max),s.ball,s.wind,s.surface,i+1,sh.target,sh.club,sh.left,sh.right,sh.long,sh.short,x,y,round(radial(sh),4),ex.has(i)?'yes':'no'];lines.push(arr.map(csv).join(','))})}exportFile('wedge-lab-shots-'+new Date().toISOString().slice(0,10)+'.csv',lines.join('\r\n'),'text/csv;charset=utf-8')}
function importScreenshot(){const ss=[
[90,0,1,0,0],[105,5,0,0,8],[110,5,0,0,5],[121,0,5,0,4],[95,4,0,2,0],[109,1,0,0,2],[112,0,5,0,7],[125,0,4,0,6],[98,5,0,0,4],[103,0,1,0,3],[110,0,1,0,4],[123,0,0,0,2],[98,2,0,0,8],[104,2,0,0,5],[119,0,0,0,3],[135,1,0,0,2],[90,4,0,7,0],[104,0,1,2,0],[119,0,0,0,3],[131,3,0,0,0]];
const id='wl-decade-screenshot-90-135';if(data.sessions.some(s=>s.id===id)){alert('That screenshot session is already imported.');return}let sh=ss.map((r,i)=>({index:i,target:r[0],left:r[1],right:r[2],long:r[3],short:r[4],club:'Unspecified'}));let score=combineScore(sh);if(Math.abs(score-71)>.02){alert('Screenshot reconstruction failed validation.');return}data.sessions.push({id,createdAt:null,completedAt:null,preset:'90-135',min:90,max:135,targets:ss.map(r=>r[0]),shots:sh,ball:'Not recorded',wind:'Not recorded',surface:'Not recorded',notes:'Imported from provided DECADE 90–135 screenshots; date and clubs not recorded.'});persist();ui.detailId=id;go('detail')}
function validateImport(j){if(!j||!Array.isArray(j.sessions))throw Error('This is not a Wedge Lab backup.');let sessions=[];for(let s of j.sessions){if(!s||typeof s.id!=='string'||!Array.isArray(s.shots)||s.shots.length!==20)continue;let min=Number(s.min),max=Number(s.max);if(!(min>=10&&max<=250&&min<=max))continue;let shots=[];for(let [i,sh] of s.shots.entries()){let clean={index:i,target:Number(sh.target),club:String(sh.club||'Unspecified').slice(0,80),left:Number(sh.left),right:Number(sh.right),long:Number(sh.long),short:Number(sh.short)};if(![clean.target,clean.left,clean.right,clean.long,clean.short].every(Number.isFinite)||clean.target<10||clean.target>250||[clean.left,clean.right,clean.long,clean.short].some(v=>v<0||v>100)||clean.left*clean.right>0||clean.long*clean.short>0){shots=[];break}shots.push(clean)}if(shots.length!==20)continue;sessions.push({id:s.id,createdAt:typeof s.createdAt==='string'?s.createdAt:null,completedAt:typeof s.completedAt==='string'?s.completedAt:null,preset:['30-75','50-90','90-135','120-155','custom'].includes(s.preset)?s.preset:'custom',min,max,targets:shots.map(x=>x.target),shots,ball:String(s.ball||'Unknown').slice(0,80),wind:String(s.wind||'Unknown').slice(0,80),surface:String(s.surface||'Unknown').slice(0,80),notes:String(s.notes||'').slice(0,2000),teamMemberId:typeof s.teamMemberId==='string'?s.teamMemberId:null,teamSyncStatus:s.teamSyncStatus==='synced'?'synced':s.teamMemberId?'pending':null})}return sessions}
function saveEdit(){let d=findSession(ui.detailId),sh=d?.shots[ui.editIndex];if(!sh)return;let vals={};for(let k of ['left','right','long','short']){let x=Number(document.getElementById('edit-'+k).value);if(!Number.isFinite(x)||x<0||x>100){alert('Enter valid non-negative misses up to 100 yards.');return}vals[k]=x}if(vals.left*vals.right>0||vals.long*vals.short>0){alert('Select only one side of each direction axis.');return}Object.assign(sh,vals,{club:document.getElementById('editclub').value});persist();go('detail');if(d.teamMemberId)WedgeTeam.onEdited(d.id)}
function handleAction(a,b){if(a==='open-club-picker'){ui.clubPickerOpen=true;render();document.querySelector('.club-picker-option.selected, .club-picker-option')?.focus();return}if(a==='close-club-picker'){ui.clubPickerOpen=false;render();document.getElementById('club-picker-trigger')?.focus();return}if(a==='edit-session-clubs')return go('bulkclub');if(a==='save-session-clubs')return saveSessionClubs();if(a==='cancel-session-clubs')return go('detail');if(a==='create')return begin();if(a==='resume'){if(!data.draft)return;ui.shotIndex=Math.min(data.draft.shots.length,19);setFormForIndex(ui.shotIndex);return go('practice')};if(a==='discard-draft'){if(confirm('Discard this unfinished combine?')){data.draft=null;persist();render()}return};if(a==='save-shot')return saveShot();if(a==='previous'){ui.shotIndex=Math.max(0,ui.shotIndex-1);setFormForIndex(ui.shotIndex);return render()};if(a==='clear-filters'){ui.filter='all';ui.club='all';return render()};if(a==='save-clubs'){let newClubs=[...new Set(document.getElementById('clubs-setting').value.split('\n').map(s=>s.trim()).filter(Boolean))].slice(0,40);if(!newClubs.length)return alert('Add at least one club.');data.clubs=newClubs;persist();return alert('Your bag has been updated.')};if(a==='export-json')return exportJSON();if(a==='export-csv')return exportCSV();if(a==='import-json')return document.getElementById('importFile').click();if(a==='import-screenshot')return importScreenshot();if(a==='save-edit')return saveEdit();if(a==='cancel-edit')return go('detail')}
document.addEventListener('click',e=>{let el=e.target.closest('[data-cloud-action],[data-club-choice],[data-team-action],[data-go],[data-preset],[data-action],[data-detail],[data-jump],[data-mode],[data-edit],[data-delete]');if(!el)return;if(el.dataset.cloudAction)return WedgeCloud.action(el.dataset.cloudAction);if(el.dataset.clubChoice!==undefined){formCache.club=el.dataset.clubChoice;ui.clubPickerOpen=false;render();document.getElementById('club-picker-trigger')?.focus();return}if(el.dataset.teamAction)return WedgeTeam.action(el.dataset.teamAction);if(el.dataset.go)return go(el.dataset.go);if(el.dataset.preset){ui.preset=el.dataset.preset;return render()}if(el.dataset.action)return handleAction(el.dataset.action);if(el.dataset.detail){ui.detailId=el.dataset.detail;return go('detail')};if(el.dataset.jump!==undefined&&data.draft){ui.shotIndex=Number(el.dataset.jump);setFormForIndex(ui.shotIndex);return render()};if(el.dataset.mode){if(ui.mode!==el.dataset.mode){ui.mode=el.dataset.mode;render()}return};if(el.dataset.edit!==undefined){ui.editIndex=Number(el.dataset.edit);return go('edit')};if(el.dataset.delete){let s=findSession(el.dataset.delete);if(s&&confirm('Permanently delete this combine? Export a backup first if you may want it later.')){if(s.teamMemberId)return WedgeTeam.deleteTeamSession(s);data.sessions=data.sessions.filter(x=>x.id!==s.id);persist();go('sessions')}return}});
document.addEventListener('keydown',e=>{if(ui.clubPickerOpen&&e.key==='Escape'){e.preventDefault();handleAction('close-club-picker')}});
document.addEventListener('input',e=>{let f=e.target.dataset.shotfield;if(f){formCache[f]=e.target.value;if(['left','right','long','short'].includes(f)&&Number(formCache[f])>0){let other={left:'right',right:'left',long:'short',short:'long'}[f];formCache[other]='';const el=document.querySelector(`[data-shotfield="${other}"]`);if(el)el.value=''}refreshPreview()}});
document.addEventListener('change',e=>{if(e.target.dataset.shotfield){formCache[e.target.dataset.shotfield]=e.target.value;refreshPreview()}if(e.target.id==='analysis-filter'){ui.filter=e.target.value;render()}if(e.target.id==='club-filter'){ui.club=e.target.value;render()}WedgeTeam.onChange(e.target)});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());const sessions=validateImport(obj);if(!sessions.length)throw Error('No valid 20-shot sessions were found.');let ids=new Set(data.sessions.map(x=>x.id)),added=0;for(let s of sessions){if(!ids.has(s.id)){data.sessions.push(s);ids.add(s.id);added++}}if(Array.isArray(obj.clubs)&&confirm('Also replace your saved club list with the one from this backup?'))data.clubs=[...new Set(obj.clubs.filter(x=>typeof x==='string').map(s=>s.slice(0,80)))].slice(0,40);persist();go('sessions');alert(`Imported ${added} new combine(s). Existing combines were left unchanged.`)}catch(err){alert('Could not import backup: '+err.message)}e.target.value=''});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
WedgeTeam.init();
WedgeCloud.init();
